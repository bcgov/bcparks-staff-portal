kind: Secret
apiVersion: v1
metadata:
  name: {{ .Release.Name }}-vault-managed-secret
  labels:
    release: {{ .Release.Name }}
    chart: {{ .Chart.Name }}
    heritage: {{ .Release.Service }}
# Values are ref+vault:// references, resolved by helm-secrets at deploy time.
# See "Vault-managed secrets" in helm/README.md.
# Consume each key with secretKeyRef, not envFrom, to keep the notice out of the environment.
stringData:
  {{- include "bcparks.vaultManagedNotice" . | nindent 2 }}
  CKEDITOR_LICENSE_KEY: "ref+vault://{{ include "bcparks.vaultMount" . }}/common/license-keys#/CKEDITOR_LICENSE_KEY"
  ADMINJS_RELATIONS_LICENSE_KEY: "ref+vault://{{ include "bcparks.vaultMount" . }}/common/license-keys#/ADMINJS_RELATIONS_LICENSE_KEY"
